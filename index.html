<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liga Next Level 7 — Torneos</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050a05;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
  }

  .header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 5;
    text-align: center;
    padding: 22px 20px 10px;
    pointer-events: none; /* deja pasar los clics hacia el fondo/torneo de abajo */
  }
  .logo-oficial {
    width: 190px;
    max-width: 55%;
    filter: drop-shadow(0 0 22px rgba(255,255,255,0.6));
    margin-bottom: 8px;
  }
  .header h1 {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,255,255,0.5), 0 2px 6px rgba(0,0,0,0.8);
    margin-bottom: 6px;
  }
  .header p {
    font-size: 18px;
    font-weight: bold;
    color: #fff;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 0 12px rgba(255,255,255,0.5), 0 2px 6px rgba(0,0,0,0.8);
  }

  .torneos {
    display: flex;
    flex-wrap: wrap;
    min-height: 100vh;
  }

  .torneo-mitad {
    flex: 1 1 50%;
    min-width: 300px;
    min-height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 8%;
    text-decoration: none;
    background-size: cover;
    background-position: center;
    position: relative;
    overflow: hidden;
  }

  .torneo-mitad.domingo {
    background-image:
      linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.15) 30%, rgba(0,0,0,0.65) 100%),
      url('fondodomingo.png');
  }
  .torneo-mitad.jueves {
    background-image:
      linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.15) 30%, rgba(0,0,0,0.65) 100%),
      url('fodojueves.png');
  }

  .torneo-logo {
    width: 34%;
    max-width: 200px;
    transition: transform 0.3s ease, filter 0.3s ease;
  }

  .torneo-mitad.domingo .torneo-logo {
    filter: drop-shadow(0 0 18px rgba(57,255,20,0.65)) drop-shadow(0 0 40px rgba(57,255,20,0.3));
  }
  .torneo-mitad.jueves .torneo-logo {
    filter: drop-shadow(0 0 18px rgba(0,180,255,0.65)) drop-shadow(0 0 40px rgba(0,180,255,0.3));
  }

  .torneo-mitad:hover .torneo-logo {
    transform: scale(1.08);
  }
  .torneo-mitad.domingo:hover .torneo-logo {
    filter: drop-shadow(0 0 28px rgba(57,255,20,0.9)) drop-shadow(0 0 55px rgba(57,255,20,0.5));
  }
  .torneo-mitad.jueves:hover .torneo-logo {
    filter: drop-shadow(0 0 28px rgba(0,180,255,0.9)) drop-shadow(0 0 55px rgba(0,180,255,0.5));
  }

  /* En móvil, apilado (uno arriba, uno abajo) según pediste */
  @media (max-width: 700px) {
    .torneo-mitad {
      flex: 1 1 100%;
      min-height: 50vh;
    }
  }

  .footer {
    text-align: center;
    padding: 14px;
    font-size: 11px;
    color: #555;
  }
</style>
</head>
<body>

<div class="header">
  <img src="logo-liga.png" alt="Next Level 7" class="logo-oficial">
  <h1>LIGA NEXT LEVEL 7</h1>
  <p>Selecciona tu torneo</p>
</div>

<div class="torneos">

  <a href="https://liganextlevel7-hash.github.io/SitioOficialNextLevel7/" class="torneo-mitad domingo" target="_blank">
    <img src="logo-domingo.png" alt="Torneo Domingo" class="torneo-logo">
  </a>

  <a href="https://liganextlevel7-hash.github.io/ligamixtajueves/" class="torneo-mitad jueves" target="_blank">
    <img src="logo-Jueves.png" alt="Torneo Mixto Jueves" class="torneo-logo">
  </a>

</div>

<div class="footer">© 2026 Liga Next Level 7 · Puebla, México</div>

</body>
</html>
